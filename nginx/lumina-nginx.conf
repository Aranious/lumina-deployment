upstream django_backends {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream nextjs_backends {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name lumina.localhost;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lumina.localhost;

    ssl_certificate     /etc/nginx/ssl/lumina.localhost+3.pem;
    ssl_certificate_key /etc/nginx/ssl/lumina.localhost+3-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;  
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static & media files (Django)
    location /static/ {
        alias /home/atraxinous/projects/lumina/backend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/atraxinous/projects/lumina/backend/media/;
        # maybe shorter cache here, because user uploads might change
        expires 1d;
        add_header Cache-Control "public";
    }

    # API and admin → load balanced Django
    location /api/ {
        proxy_pass http://django_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://django_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend → load balanced Next.js
    location / {
        proxy_pass http://nextjs_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}