upstream django_backends {
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
}

upstream nextjs_backends {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name lumina.localhost;
    return 301 https://$server_name$request_uri;
}

# HTTPS main server block
server {
    listen 443 ssl http2;
    server_name lumina.localhost;

    # SSL certificates 
    ssl_certificate     /etc/nginx/ssl/lumina.localhost+3.pem;     
    ssl_certificate_key /etc/nginx/ssl/lumina.localhost+3-key.pem;

    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static & media files (Django)
    location /static/ {
        alias /home/atraxinous/projects/lumina/backend/static/;
    }
    location /media/ {
        alias /home/atraxinous/projects/lumina/backend/media/;
    }

    # API and admin → load balanced Django
    location /api/ {
        proxy_pass http://django_backends;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://django_backends;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend → load balanced Next.js
    location / {
        proxy_pass http://nextjs_backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}